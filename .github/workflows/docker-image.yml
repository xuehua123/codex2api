            DEPLOY_IMAGE="$deploy_image" SERVICE_NAME="$SERVICE_NAME" COMPOSE_FILE="$COMPOSE_FILE" python3 -c "from pathlib import Path; import os; path=Path(os.environ['COMPOSE_FILE']); deploy=os.environ['DEPLOY_IMAGE']; service=os.environ['SERVICE_NAME']; lines=path.read_text().splitlines(); service_idx=next((i for i,line in enumerate(lines) if line.strip()==service + ':'), None); assert service_idx is not None, 'service not found'; service_indent=len(lines[service_idx])-len(lines[service_idx].lstrip()); end=next((i for i in range(service_idx + 1, len(lines)) if lines[i].strip() and len(lines[i])-len(lines[i].lstrip()) <= service_indent), len(lines)); image_idx=next((i for i in range(service_idx + 1, end) if lines[i].lstrip().startswith('image:')), None); assert image_idx is not None, 'image line not found'; prefix=lines[image_idx][:len(lines[image_idx])-len(lines[image_idx].lstrip())]; lines[image_idx]=prefix + 'image: ' + deploy; path.write_text('\n'.join(lines) + '\n')"

